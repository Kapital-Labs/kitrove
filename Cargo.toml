[workspace]
resolver = "2"
members = [
  "crates/kitrove-model",
  "crates/kitrove-adapter-api",
  "crates/kitrove-core",
  "crates/kitrove-version-probe",
  "crates/kitrove-cli",
  "crates/kitrove-testkit",
  "crates/kitrove-agent-skills",
  "crates/kitrove-instructions",
  "crates/kitrove-prompt-commands",
  "crates/kitrove-frontmatter",
  "crates/kitrove-agents",
  "crates/kitrove-mcp",
  "crates/kitrove-risk",
  "crates/kitrove-windows-security",
  "crates/kitrove-windows-process",
  "crates/kitrove-windows-names",
  "crates/kitrove-release-policy",
  "crates/kitrove-release-provenance",
  "crates/kitrove-installer",
  "crates/kitrove-state-lifecycle",
  "crates/adapters/kitrove-adapter-claude",
  "crates/adapters/kitrove-adapter-codex",
  "crates/adapters/kitrove-adapter-pi",
  "crates/adapters/kitrove-adapter-opencode",
  "xtask",
]
exclude = [
  "third_party/jsonc-parser",
  "third_party/pageant",
  "third_party/sigstore-rekor",
  "third_party/sigstore-tsa",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Brandon Kaplan"]
repository = "https://github.com/Kapital-Labs/kitrove"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.2"
const-oid = "=0.9.6"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
calcifer-macos-acl = "=0.1.0"
fs2 = "0.4.3"
futures = "=0.3.34"
getrandom = "0.3.3"
data-encoding = "=2.11.1"
der = "=0.7.10"
gix-hash = { version = "=0.26.2", default-features = false, features = ["sha1"] }
gix-object = { version = "=0.64.1", default-features = false }
gix-pack = { version = "=0.74.2", default-features = false, features = ["sha1"] }
gix-packetline = { version = "=0.22.2", default-features = false, features = ["blocking-io"] }
gix-zlib = { version = "=0.1.0", default-features = false }
hmac = "=0.13.0"
jsonc-parser = { version = "=0.32.1", features = ["serde_json"] }
kitrove-model = { path = "crates/kitrove-model" }
kitrove-adapter-api = { path = "crates/kitrove-adapter-api" }
kitrove-core = { path = "crates/kitrove-core" }
kitrove-version-probe = { path = "crates/kitrove-version-probe" }
kitrove-testkit = { path = "crates/kitrove-testkit" }
kitrove-agent-skills = { path = "crates/kitrove-agent-skills" }
kitrove-instructions = { path = "crates/kitrove-instructions" }
kitrove-prompt-commands = { path = "crates/kitrove-prompt-commands" }
kitrove-frontmatter = { path = "crates/kitrove-frontmatter" }
kitrove-agents = { path = "crates/kitrove-agents" }
kitrove-mcp = { path = "crates/kitrove-mcp" }
kitrove-risk = { path = "crates/kitrove-risk" }
lzma-rust2 = { version = "=0.20.1", default-features = false, features = ["std", "xz", "encoder"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = { version = "=0.11.0", default-features = false }
tar = { version = "=0.4.46", default-features = false }
xz4rust = { version = "=0.2.3", default-features = false, features = ["std", "bcj", "crc64", "delta", "no_unsafe"] }
semver = "=1.0.28"
sha1 = "=0.11.0"
sigstore-trust-root = { version = "=0.11.0", default-features = false }
sigstore-types = "=0.11.0"
sigstore-verify = { version = "=0.11.0", default-features = false }
toml = "0.9.5"
toml_edit = "=0.25.13"
yaml_serde = "0.10.7"
tempfile = "3.27.0"
wait-timeout = "=0.2.1"
unicase = "=2.9.0"
unicode-normalization = "=0.1.25"
rustix = { version = "1.1.4", features = ["fs", "process"] }
rand = "=0.10.2"
rpassword = "=7.5.4"
russh = { version = "=0.62.0", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.32", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"
webpki-roots = "=1.0.9"
zeroize = "=1.9.0"
kitrove-windows-security = { path = "crates/kitrove-windows-security" }
kitrove-windows-process = { path = "crates/kitrove-windows-process" }
kitrove-windows-names = { path = "crates/kitrove-windows-names" }
kitrove-release-policy = { path = "crates/kitrove-release-policy" }
kitrove-release-provenance = { path = "crates/kitrove-release-provenance" }
kitrove-installer = { path = "crates/kitrove-installer" }
kitrove-state-lifecycle = { path = "crates/kitrove-state-lifecycle" }
windows-sys = "=0.61.2"
x509-cert = { version = "=0.2.5", default-features = false }
zip = { version = "=6.0.0", default-features = false }
zlib-rs = { version = "=0.6.7", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
# Upstream 0.32.1 supplies the strict JSONC controls Kitrove requires, but uses
# let-chain syntax newer than the workspace's Rust 1.85 floor. This audited
# source patch changes syntax only; see third_party/jsonc-parser/KITROVE_PATCH.md.
jsonc-parser = { path = "third_party/jsonc-parser" }

# Upstream 0.2.0 declares Rust 1.85 support but uses one let-chain that was not
# stabilized until Rust 1.88. This audited source patch changes syntax only;
# see third_party/pageant/KITROVE_PATCH.md.
pageant = { path = "third_party/pageant" }

# Upstream 0.11.0 unconditionally includes its HTTP client even when only its
# offline signed-entry types are used. This audited patch feature-gates only
# that client surface; see third_party/sigstore-rekor/KITROVE_PATCH.md.
sigstore-rekor = { path = "third_party/sigstore-rekor" }

# Upstream 0.11.0 also unconditionally includes its HTTP timestamp client.
# This audited patch feature-gates only that client surface; see
# third_party/sigstore-tsa/KITROVE_PATCH.md.
sigstore-tsa = { path = "third_party/sigstore-tsa" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
