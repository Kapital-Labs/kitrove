[package]
edition = "2021"
rust-version = "1.70"
name = "sigstore-tsa"
version = "0.11.0"
description = "RFC 3161 Time-Stamp Protocol client for Sigstore"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/prefix-dev/sigstore-rust"

[features]
default = ["client", "rustls"]
client = ["dep:reqwest"]
native-tls = ["client", "reqwest/native-tls"]
rustls = ["client", "reqwest/rustls"]

[dependencies]
aws-lc-rs = "1.17"
base64 = "0.22"
cmpv2 = { version = "0.2", default-features = false }
cms = { version = "0.2", default-features = false }
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
hex = "0.4"
jiff = { version = "0.2", features = ["serde", "std"] }
rand = "0.9.4"
reqwest = { version = "0.13", features = ["json", "form"], default-features = false, optional = true }
rustls-pki-types = { version = "1.14", features = ["alloc"], default-features = false }
rustls-webpki = { version = "0.103", features = ["alloc", "std", "aws-lc-rs"], default-features = false }
sigstore-crypto = "0.11.0"
sigstore-types = "0.11.0"
thiserror = "2.0"
tracing = "0.1"
x509-cert = { version = "0.2", features = ["builder", "sct"] }
x509-tsp = { version = "0.1", default-features = false }

[dev-dependencies]
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
hex = "0.4"
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
