name: Product website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate site and build the exact public inventory
        run: |
          python3 -m unittest discover -s website/tests
          node --check website/app.js
          python3 website/build.py "$RUNNER_TEMP/kitrove-site"
      - name: Require green public main before publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD: ${{ github.sha }}
        run: |
          test "$REPOSITORY" = Kapital-Labs/kitrove
          test "$REF" = refs/heads/main
          test "$(gh api repos/Kapital-Labs/kitrove/git/ref/heads/main --jq .object.sha)" = "$HEAD"
          for workflow in ci.yml secret-scan.yml; do
            result=$(gh api "repos/Kapital-Labs/kitrove/actions/workflows/$workflow/runs?head_sha=$HEAD&event=push&branch=main&per_page=1" --jq '.workflow_runs[0] | select(.status == "completed") | .conclusion')
            test "$result" = success
          done
      - name: Upload public site only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/kitrove-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Kapital-Labs/kitrove' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy reviewed static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
