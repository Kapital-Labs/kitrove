name: Isolated product signing target

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

    outputs:
      inventory:
        description: SHA-256 of the exact build inventory
        value: ${{ jobs.build.outputs.inventory }}

permissions:
  contents: read

env:
  DIST_TARGET: ${{ inputs.target }}
  RELEASE_TAG: v0.0.0
  KITROVE_SIGNING_REHEARSAL_SHA: ${{ vars.KITROVE_SIGNING_REHEARSAL_SHA }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Kapital-Labs/kitrove' &&
      github.ref == 'refs/heads/main' &&
      github.sha == vars.KITROVE_SIGNING_REHEARSAL_SHA &&
      contains(fromJSON('["aarch64-apple-darwin","x86_64-apple-darwin","x86_64-pc-windows-msvc"]'), inputs.target)
    runs-on: ${{ inputs.target == 'aarch64-apple-darwin' && 'macos-15' || inputs.target == 'x86_64-apple-darwin' && 'macos-15-intel' || 'windows-2025' }}
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      inventory: ${{ steps.handoff.outputs.inventory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build the reviewed products without signing credentials
        shell: bash
        run: python3 scripts/signing_rehearsal.py build
      - name: Bind the exact build handoff
        id: handoff
        shell: bash
        run: python3 scripts/signing_rehearsal.py inventory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signing-input-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing-input/*
          if-no-files-found: error
          retention-days: 1
