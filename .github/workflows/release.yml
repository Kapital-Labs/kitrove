# This file was based on the workflow autogenerated by dist: https://axodotdev.github.io/cargo-dist
# Repository-specific permission and archive-verification hardening is validated by xtask.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SIGNING_PROVISIONED: ${{ vars.KITROVE_HOSTED_SIGNING_READY }}
    steps:
      - name: Require separately approved hosted signing provisioning
        shell: bash
        run: |
          if [[ "$SIGNING_PROVISIONED" != "true" ]]; then
            echo "Hosted signing is not provisioned; see docs/RELEASE-SIGNING.md" >&2
            exit 1
          fi
      - name: Reject unsafe release tag syntax
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "release tag must use safe v-prefixed version syntax" >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Match the distributable Cargo package version
        shell: bash
        run: |
          mapfile -t package_versions < <(
            cargo metadata --locked --no-deps --format-version=1 |
              jq --raw-output '.packages[] | select(.name == "kitrove-cli") | .version'
          )
          if [[ "${#package_versions[@]}" -ne 1 || "$RELEASE_TAG" != "v${package_versions[0]}" ]]; then
            echo "release tag must exactly match v<kitrove-cli package version>" >&2
            exit 1
          fi
      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Run canonical repository validation
        run: cargo xtask ci
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check every workspace target on the MSRV
        run: cargo +1.85.0 check --locked --workspace --all-targets

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    needs:
      - validate
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Require a commit already accepted by main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install dist
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-dist.tar.xz"
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-x86_64-unknown-linux-gnu.tar.xz \
            --output "$archive"
          echo "eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          install "$RUNNER_TEMP/cargo-dist-x86_64-unknown-linux-gnu/dist" "$HOME/.cargo/bin/dist"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist host --steps=create --tag="$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    timeout-minutes: 60
    environment: release
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: verified-local-artifacts/${{ join(matrix.targets, '-') }}-dist-manifest.json
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        if: runner.os != 'Windows'
        shell: bash
        env:
          DIST_TARGET: ${{ matrix.targets[0] }}
        run: |
          case "$DIST_TARGET" in
            aarch64-apple-darwin)
              digest="aa343b2ff78ec2981f17a65140250c5ad6062c74072163f68c5c2686d94763a7"
              ;;
            x86_64-apple-darwin)
              digest="6243464a8389e006b9256ee548bc795638f1a17113c1b6669c0e05ce89fd05c5"
              ;;
            x86_64-unknown-linux-gnu)
              digest="eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946"
              ;;
            *)
              echo "unsupported dist host target: $DIST_TARGET" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/cargo-dist.tar.xz"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-$DIST_TARGET.tar.xz" \
            --output "$archive"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "$digest  $archive" | shasum -a 256 --check
          else
            echo "$digest  $archive" | sha256sum --check --strict
          fi
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          install "$RUNNER_TEMP/cargo-dist-$DIST_TARGET/dist" "$HOME/.cargo/bin/dist"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dist on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DIST_TARGET: ${{ matrix.targets[0] }}
        run: |
          if ($env:DIST_TARGET -ne "x86_64-pc-windows-msvc") {
            throw "unsupported dist host target: $env:DIST_TARGET"
          }
          $archive = Join-Path $env:RUNNER_TEMP "cargo-dist.zip"
          Invoke-WebRequest -Uri "https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $expected = "26e845cabff12a92911ce960af73a86c8f9b2b2d9072b01dfe5b662acf044fa3"
          $observed = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($observed -ne $expected) {
            throw "cargo-dist archive checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "cargo-dist-bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "dist.exe") (Join-Path $bin "dist.exe")
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build --tag="$RELEASE_TAG" --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: application-archive
        name: Select the exact application and installer archives
        shell: bash
        env:
          DIST_TARGET: ${{ matrix.targets[0] }}
          DIST_TARGETS: ${{ join(matrix.targets, ', ') }}
        run: |
          if [[ "$DIST_TARGETS" != "$DIST_TARGET" ]]; then
            echo "application archive attestation requires exactly one target" >&2
            exit 1
          fi
          case "$DIST_TARGET" in
            aarch64-apple-darwin|x86_64-apple-darwin|x86_64-unknown-linux-gnu)
              archive="target/distrib/kitrove-cli-$DIST_TARGET.tar.xz"
              ;;
            x86_64-pc-windows-msvc)
              archive="target/distrib/kitrove-cli-$DIST_TARGET.zip"
              ;;
            *)
              echo "unsupported application archive target: $DIST_TARGET" >&2
              exit 1
              ;;
          esac
          test -f "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          installer_archive="${archive/kitrove-cli-/kitrove-installer-}"
          test -f "$installer_archive"
          echo "installer_path=$installer_archive" >> "$GITHUB_OUTPUT"
      - name: Compile Apple signing helpers before exposing credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --locked -p xtask
          install -m 700 target/debug/xtask "$RUNNER_TEMP/kitrove-release-xtask"
          xcrun swiftc scripts/hosted_apple_import.swift -o "$RUNNER_TEMP/kitrove-apple-import"
      - name: Prepare both Apple release archives in an isolated Keychain
        if: runner.os == 'macOS'
        env:
          DIST_TARGET: ${{ matrix.targets[0] }}
          P12: ${{ secrets.KITROVE_APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KITROVE_APPLE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.KITROVE_APPLE_ID }}
          TEAM_ID: ${{ secrets.KITROVE_APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.KITROVE_GITHUB_NOTARIZATION }}
        run: python3 scripts/hosted_apple_signing.py
      - id: verified-local
        name: Sign and bind release metadata to the built executable
        shell: bash
        env:
          DIST_TARGET: ${{ matrix.targets[0] }}
        run: |
          mkdir -m 700 verified-local-artifacts
          for archive in \
            "${{ steps.application-archive.outputs.path }}" \
            "${{ steps.application-archive.outputs.installer_path }}"
          do
            if [[ "$RUNNER_OS" != "macOS" ]]; then
              cargo xtask prepare-platform-release \
                "$archive" "$DIST_TARGET" "$RELEASE_TAG" \
                release/application-compatibility.json dist-manifest.json
            fi
            cargo xtask verify-application-release "$archive" "$DIST_TARGET" "$RELEASE_TAG"
            python3 scripts/verify_release_archives.py "$archive"
            staged_archive="verified-local-artifacts/$(basename "$archive")"
            cp "$archive" "$staged_archive"
            cp "$archive.sha256" "$staged_archive.sha256"
          done
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
          for archive in \
            "${{ steps.application-archive.outputs.path }}" \
            "${{ steps.application-archive.outputs.installer_path }}"
          do
            cargo xtask verify-application-release-bundle \
              "verified-local-artifacts/$(basename "$archive")" \
              "$DIST_TARGET" "$RELEASE_TAG" "$BUILD_MANIFEST_NAME"
          done
          echo "staged_path=verified-local-artifacts/$(basename "${{ steps.application-archive.outputs.path }}")" >> "$GITHUB_OUTPUT"
          echo "installer_staged_path=verified-local-artifacts/$(basename "${{ steps.application-archive.outputs.installer_path }}")" >> "$GITHUB_OUTPUT"
      - name: Attest the exact application archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.verified-local.outputs.staged_path }}
      - name: Attest the exact installer archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.verified-local.outputs.installer_staged_path }}
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: verified-local-artifacts/*

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      BUILD_MANIFEST_NAME: verified-global-artifacts/global-dist-manifest.json
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - shell: bash
        run: |
          dist build --tag="$RELEASE_TAG" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          for package in kitrove-cli kitrove-installer; do
            cargo xtask harden-powershell-installer \
              "target/distrib/$package-installer.ps1" \
              "target/distrib/$package-x86_64-pc-windows-msvc.zip" \
              x86_64-pc-windows-msvc
          done

          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-msvc
          do
            case "$target" in
              x86_64-pc-windows-msvc) extension="zip" ;;
              *) extension="tar.xz" ;;
            esac
            for package in kitrove-cli kitrove-installer; do
              cargo xtask verify-application-release \
                "target/distrib/$package-$target.$extension" "$target" "$RELEASE_TAG"
            done
          done
          python3 scripts/verify_release_archives.py target/distrib
          python3 scripts/verify_release_archives.py \
            --stage verified-global-artifacts \
            --release-tag "$RELEASE_TAG" \
            target/distrib
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-msvc
          do
            case "$target" in
              x86_64-pc-windows-msvc) extension="zip" ;;
              *) extension="tar.xz" ;;
            esac
            for package in kitrove-cli kitrove-installer; do
              cargo xtask verify-application-release \
                "verified-global-artifacts/$package-$target.$extension" "$target" "$RELEASE_TAG"
            done
          done

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Attest global release controls
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            verified-global-artifacts/kitrove-cli-installer.sh
            verified-global-artifacts/kitrove-cli-installer.ps1
            verified-global-artifacts/kitrove-installer-installer.sh
            verified-global-artifacts/kitrove-installer-installer.ps1
            verified-global-artifacts/source.tar.gz
            verified-global-artifacts/source.tar.gz.sha256
            verified-global-artifacts/sha256.sum
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-global
          path: verified-global-artifacts/*
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Publish only after planning and every required artifact job succeeds.
    if: ${{ always() && needs.plan.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.build-local-artifacts.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    runs-on: "ubuntu-22.04"
    environment: release
    permissions:
      "contents": "write"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host --tag="$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Reverify fetched release archives
        shell: bash
        run: |
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-msvc
          do
            case "$target" in
              x86_64-pc-windows-msvc) extension="zip" ;;
              *) extension="tar.xz" ;;
            esac
            for package in kitrove-cli kitrove-installer; do
              cargo xtask verify-application-release \
                "artifacts/$package-$target.$extension" "$target" "$RELEASE_TAG"
            done
          done
          python3 scripts/verify_release_archives.py \
            --stage verified-artifacts \
            --release-tag "$RELEASE_TAG" \
            artifacts
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-msvc
          do
            case "$target" in
              x86_64-pc-windows-msvc) extension="zip" ;;
              *) extension="tar.xz" ;;
            esac
            for package in kitrove-cli kitrove-installer; do
              cargo xtask verify-application-release \
                "verified-artifacts/$package-$target.$extension" "$target" "$RELEASE_TAG"
            done
          done
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json artifacts/dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          release_args=("$RELEASE_TAG" --draft --target "$RELEASE_COMMIT"
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt")
          case "$PRERELEASE_FLAG" in
            --prerelease) release_args+=(--prerelease) ;;
            '') ;;
            *) echo 'Invalid prerelease flag' >&2; exit 1 ;;
          esac
          gh release create "${release_args[@]}" verified-artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
