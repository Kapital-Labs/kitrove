name: Apple signing check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-credential-check
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'Kapital-Labs/kitrove' &&
      github.ref == 'refs/heads/signing-preflight' &&
      github.sha == vars.KITROVE_APPLE_PREFLIGHT_SHA
    runs-on: macos-15
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile the reviewed helper and fixed test fixture without credentials
        shell: bash
        run: |
          xcrun swiftc import-identity.swift -o "$RUNNER_TEMP/import-identity"
          printf '%s\n' 'int main(void) { return 0; }' |
            xcrun clang -x c - -o "$RUNNER_TEMP/kitrove-signing-test"
      - name: Rehearse isolated signing and notarization without publishing
        env:
          P12: ${{ secrets.KITROVE_APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KITROVE_APPLE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.KITROVE_APPLE_ID }}
          TEAM_ID: ${{ secrets.KITROVE_APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.KITROVE_GITHUB_NOTARIZATION }}
        run: python3 apple-signing-check.py
