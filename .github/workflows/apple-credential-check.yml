name: Apple credential check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-credential-check
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'Kapital-Labs/kitrove' &&
      github.ref == 'refs/heads/signing-preflight' &&
      github.sha == vars.KITROVE_APPLE_PREFLIGHT_SHA
    runs-on: macos-15
    timeout-minutes: 5
    environment: release
    steps:
      - name: Check encrypted identity and notarization access without signing or publishing
        shell: python3 {0}
        env:
          P12: ${{ secrets.KITROVE_APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KITROVE_APPLE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.KITROVE_APPLE_ID }}
          TEAM_ID: ${{ secrets.KITROVE_APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.KITROVE_GITHUB_NOTARIZATION }}
        run: |
          import base64
          import errno
          import hashlib
          import os
          import pty
          import select
          import signal
          import subprocess
          import tempfile
          import termios
          import time

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def command(args, payload):
              result = subprocess.run(args, input=payload, stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL, timeout=30, check=False)
              require(result.returncode == 0, 'Native certificate check failed')
              return result.stdout

          def check():
              # Remove credentials before spawning children; pass only the exact
              # needed value over stdin or a no-echo terminal. Never print output.
              values = {key: os.environ.pop(key, '') for key in
                  ('P12', 'P12_PASSWORD', 'APPLE_ID', 'TEAM_ID', 'NOTARY_PASSWORD')}
              require(all(values.values()), 'Required credential is missing')
              require(values['TEAM_ID'] == '98RZ36ES7A', 'Unexpected Apple team')
              require(all('\n' not in value and '\r' not in value for value in
                  (values['P12_PASSWORD'], values['NOTARY_PASSWORD'])), 'Invalid credential encoding')
              archive = base64.b64decode(values['P12'], validate=True)
              require(0 < len(archive) < 32000, 'Invalid encrypted identity size')
              with tempfile.TemporaryDirectory(prefix='kitrove-credential-check-') as directory:
                  path = os.path.join(directory, 'identity.p12')
                  with open(path, 'xb') as stream:
                      os.chmod(path, 0o600)
                      stream.write(archive)
                  password = (values['P12_PASSWORD'] + '\n').encode()
                  options = ['/usr/bin/openssl', 'pkcs12', '-in', path, '-passin', 'stdin']
                  certificate = command(options + ['-clcerts', '-nokeys'], password)
                  private_key = command(options + ['-nocerts', '-nodes'], password)
                  require(certificate.count(b'-----BEGIN CERTIFICATE-----') == 1,
                      'Expected exactly one identity certificate')
                  require(private_key.count(b'PRIVATE KEY-----\n') == 2,
                      'Expected exactly one private key')
                  der = command(['/usr/bin/openssl', 'x509', '-outform', 'DER'], certificate)
                  require(hashlib.sha1(der).hexdigest().upper() ==
                      'D9A906454D05C808AA070F9BC91F1A29BF0F6CC6', 'Unexpected signing identity')
                  command(['/usr/bin/openssl', 'x509', '-checkend', '0', '-noout'], certificate)
                  public = command(['/usr/bin/openssl', 'x509', '-pubkey', '-noout'], certificate)
                  derived = command(['/usr/bin/openssl', 'pkey', '-pubout'], private_key)
                  require(public == derived, 'Certificate and private key do not match')
                  del private_key
              print('Encrypted identity password, fingerprint, expiry and key pair verified.', flush=True)

              # history is read-only. No profile is stored and nothing is uploaded
              # to Apple. The native tool asks for the password on its terminal.
              pid, terminal = pty.fork()
              if pid == 0:
                  os.execv('/usr/bin/xcrun', ['xcrun', 'notarytool', 'history',
                      '--apple-id', values['APPLE_ID'], '--team-id', values['TEAM_ID'],
                      '--output-format', 'json'])
              output = bytearray()
              sent = False
              reaped = False
              deadline = time.monotonic() + 90
              try:
                  while time.monotonic() < deadline:
                      if select.select([terminal], [], [], 0.1)[0]:
                          try:
                              data = os.read(terminal, 4096)
                          except OSError as error:
                              if error.errno != errno.EIO:
                                  raise
                              data = b''
                          output.extend(data)
                          require(len(output) <= 262144, 'Notary response exceeded limit')
                      if not sent and b'password' in output.lower():
                          if not termios.tcgetattr(terminal)[3] & termios.ECHO:
                              payload = (values['NOTARY_PASSWORD'] + '\n').encode()
                              require(os.write(terminal, payload) == len(payload), 'Incomplete credential input')
                              sent = True
                      finished, status = os.waitpid(pid, os.WNOHANG)
                      if finished:
                          reaped = True
                          require(sent and os.waitstatus_to_exitcode(status) == 0,
                              'Notarization authentication failed')
                          print('Apple notarization authentication verified. No signing or publication performed.')
                          return
                  raise RuntimeError('Notarization check timed out')
              finally:
                  if not reaped:
                      os.kill(pid, signal.SIGKILL)
                      os.waitpid(pid, 0)
                  os.close(terminal)

          try:
              check()
          except Exception:
              # Provider output and exception data may contain credentials.
              print('Credential check failed. No signing or publication performed.')
              raise SystemExit(1)
