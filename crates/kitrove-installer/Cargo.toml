[package]
name = "kitrove-installer"
description = "Offline current-user installer transaction for Kitrove"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[package.metadata.dist]
dist = true

[package.metadata.dist.binaries]
aarch64-apple-darwin = ["kitrove-installer"]
x86_64-apple-darwin = ["kitrove-installer"]
x86_64-unknown-linux-gnu = ["kitrove-installer"]
x86_64-pc-windows-msvc = ["kitrove-installer"]

[dependencies]
kitrove-release-policy.workspace = true
kitrove-release-provenance.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
kitrove-state-lifecycle.workspace = true
kitrove-model.workspace = true
kitrove-version-probe.workspace = true
semver.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
fs2.workspace = true
getrandom.workspace = true
rustix = { workspace = true, features = ["fs", "thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
calcifer-macos-acl.workspace = true

[target.'cfg(windows)'.dependencies]
cap-std.workspace = true
fs2.workspace = true
getrandom.workspace = true
kitrove-windows-security.workspace = true

[dev-dependencies]
kitrove-release-provenance = { workspace = true, features = ["test-support"] }
lzma-rust2.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dev-dependencies]
kitrove-testkit.workspace = true

[target.'cfg(windows)'.dev-dependencies]
kitrove-windows-security = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
